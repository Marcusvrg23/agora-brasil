name: Pacote de preview isolado
on:
  push:
    branches:
      - preview/ragdoll-pr9-20261023
  pull_request:
    branches:
      - fix/animacao-corrida-higgsfield-v2-20261023
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Testar sintaxe
        run: |
          npm run check
          node --check public/ragdoll-experimental.mjs
          node --check test/ragdoll-experimental.test.mjs
          node --check scripts/package-preview.mjs
          node --check scripts/sprint-contact-qa.mjs
      - name: Executar suite automatizada
        run: timeout 100s node --test --test-timeout=12000 --test-force-exit
      - name: Montar pacote de preview separado
        run: node scripts/package-preview.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: agora-brasil-release-candidate-preview
          path: |
            agora-brasil-preview-qa.zip
            agora-brasil-preview-qa.zip.sha256
          retention-days: 14
