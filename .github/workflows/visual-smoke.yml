name: Screenshots e Smoke Visual - Agora Brasil
on:
  push:
    branches: [feat/caminhoes-personagens-corrida-higgsfield]
    paths: ['.github/workflows/visual-smoke.yml','scripts/visual-smoke.cjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install chromium --with-deps
      - name: Capturar ambiente 3D e checar WebSocket
        run: node scripts/visual-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-agora-brasil
          path: screenshots/*.png
          retention-days: 30
      - name: Publicar screenshots na branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "test: screenshots reais do jogo [skip ci]"
            git push
          fi
